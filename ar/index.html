<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#090909">
<title>Гастробар на Ясной - AR меню</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
<style>
:root{--bg:#090909;--text:#f4efe7;--muted:#9f9991;--line:#242321;--accent:#c89a59}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}body{min-height:100svh;overflow-x:hidden}.app{min-height:100svh;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 44%,rgba(126,80,35,.18),transparent 30%),linear-gradient(#0b0b0b,#090909 72%)}
header{height:72px;flex:0 0 72px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line)}.brand b{display:block;font-size:13px;letter-spacing:.08em}.brand small{display:block;margin-top:5px;font-size:9px;color:var(--muted);letter-spacing:.05em}.badge{font-size:10px;border:1px solid #4a4742;border-radius:999px;padding:8px 11px;color:#d2cbc2}
main{flex:1;min-height:0;display:flex;flex-direction:column;padding:20px 18px 18px}.eyebrow{font-size:10px;letter-spacing:.18em;color:var(--accent);text-transform:uppercase}.title{font-size:clamp(34px,10vw,50px);line-height:.95;letter-spacing:-.05em;margin:10px 0 0;max-width:10ch}.sub{margin-top:10px;color:var(--muted);font-size:13px;line-height:1.35}
.stage{position:relative;flex:1;min-height:330px;margin:8px -6px 0;display:flex;align-items:center;justify-content:center}.glow{position:absolute;width:78%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(167,104,47,.26),rgba(167,104,47,0) 68%);filter:blur(10px)}
model-viewer{position:relative;z-index:2;width:100%;height:100%;min-height:330px;--poster-color:transparent;background:transparent}.arbtn{position:absolute;left:7%;right:7%;bottom:8px;border:0;border-radius:24px;background:#f3ede4;color:#101010;padding:18px 16px;font-size:17px;font-weight:900;letter-spacing:.02em;text-transform:uppercase;box-shadow:0 18px 44px rgba(0,0,0,.42)}.arbtn small{display:block;margin-top:6px;font-size:10px;font-weight:500;text-transform:none;letter-spacing:0;color:#6c665f}.load{position:absolute;z-index:5;left:50%;bottom:92px;transform:translateX(-50%);font-size:10px;color:#8e8881;letter-spacing:.06em;text-transform:uppercase;transition:.2s}.ready .load{opacity:0}.failed .load{color:#c69b9b}.hint{text-align:center;color:#8e8881;font-size:10px;margin-top:8px}.proof{display:flex;justify-content:center;gap:14px;margin-top:9px;color:#7f7972;font-size:9px;letter-spacing:.06em;text-transform:uppercase}.proof span{white-space:nowrap}
footer{height:42px;flex:0 0 42px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-top:1px solid var(--line);color:#77716b;font-size:9px}
@media(min-width:760px){.app{max-width:520px;margin:0 auto;border-left:1px solid #181818;border-right:1px solid #181818}.title{font-size:48px}.stage{min-height:430px}model-viewer{min-height:430px}}
</style>
</head>
<body>
<div class="app" id="app">
<header>
  <div class="brand"><b>ГАСТРОБАР НА ЯСНОЙ</b><small>AR MENU · DEMO</small></div>
  <div class="badge">DEMO 11</div>
</header>
<main>
  <div class="eyebrow">Креветки гриль</div>
  <h1 class="title">Посмотри блюдо у себя на столе</h1>
  <div class="sub">Оцени подачу и размер до заказа.</div>
  <div class="stage">
    <div class="glow"></div>
    <model-viewer id="dish"
      src="/api/model?v=11"
      poster="https://drive.google.com/thumbnail?id=1ML01ni4Dha6LFTpYFS3jQKI2v9Pie7xq&sz=w1600&v=11"
      loading="eager"
      reveal="manual"
      environment-image="neutral"
      exposure="1.03"
      shadow-intensity="0"
      tone-mapping="neutral"
      ar
      ar-placement="floor"
      ar-scale="fixed"
      ar-modes="quick-look webxr scene-viewer"
      camera-target="0m 0m 0m"
      camera-orbit="0deg 0deg 0.56m"
      field-of-view="31deg"
      alt="Креветки гриль Гастробара на Ясной">
      <button class="arbtn" slot="ar-button">Открыть AR<small>наведи камеру на поверхность и размести блюдо</small></button>
    </model-viewer>
    <div class="load">загружаем AR</div>
  </div>
  <div class="hint">Лучше смотреть в Safari на iPhone</div>
  <div class="proof"><span>реальный размер</span><span>1 касание</span><span>без приложения</span></div>
</main>
<footer><span>YASNAYA × KAVA</span><span>AR DEMO V11</span></footer>
</div>
<script>
const app=document.getElementById('app');
const viewer=document.getElementById('dish');
viewer.addEventListener('load',()=>app.classList.add('ready'),{once:true});
viewer.addEventListener('error',()=>app.classList.add('failed'),{once:true});
setTimeout(()=>{if(!app.classList.contains('ready'))app.classList.add('failed')},20000);
</script>
</body>
</html>
