<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<title>Гастробар на Ясной - AR MENU DEMO</title>
<meta name="description" content="Демо AR меню Гастробара на Ясной. Посмотрите блюдо прямо на столе через камеру телефона.">
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<style>
:root{--bg:#090909;--text:#f5f0e7;--muted:#9b968d;--line:#272624;--accent:#a71820}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{min-height:100svh}.app{min-height:100svh;display:grid;grid-template-rows:auto 1fr auto}
header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);gap:12px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}.logo{width:34px;height:34px;border:1px solid #cfc7ba;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:900;letter-spacing:.08em}
.brand b{display:block;font-size:13px;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.badge{font-size:9px;letter-spacing:.16em;border:1px solid #46433f;border-radius:999px;padding:7px 9px;color:#c9c1b5;white-space:nowrap}
main{position:relative;min-height:0;background:radial-gradient(circle at 50% 38%,rgba(87,61,45,.28),transparent 38%),linear-gradient(180deg,#171513,#090909 72%)}
model-viewer{width:100%;height:calc(100svh - 114px);min-height:590px;background:transparent;--poster-color:transparent}
.copy{position:absolute;z-index:5;left:18px;right:18px;top:18px;pointer-events:none}.eyebrow{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#bfb6aa;margin-bottom:9px}
h1{font-size:clamp(34px,10vw,58px);line-height:.88;letter-spacing:-.06em;margin:0;max-width:8ch}.sub{margin-top:12px;color:#b9b2a8;font-size:12px;line-height:1.45;max-width:34ch}
.live{display:inline-flex;align-items:center;gap:7px;margin-top:12px;color:#ddd5ca;font-size:9px;letter-spacing:.15em;text-transform:uppercase}.live:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 rgba(167,24,32,.55);animation:pulse 1.7s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(167,24,32,0)}}.arbtn{position:absolute;left:18px;right:18px;bottom:20px;border:0;border-radius:16px;background:#f3ede4;color:#111;padding:16px 18px;font-size:14px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 18px 45px rgba(0,0,0,.4);cursor:pointer}
.arbtn small{display:block;margin-top:3px;font-size:10px;font-weight:500;letter-spacing:0;text-transform:none;color:#69655f}.load{position:absolute;z-index:7;left:18px;right:18px;bottom:20px;border-radius:16px;border:1px solid #3a3834;background:rgba(12,12,12,.92);padding:15px 16px;color:#d4cdc3;font-size:12px;transition:.25s}
.load i{display:block;height:3px;margin-top:9px;background:#262522;border-radius:999px;overflow:hidden}.load i:after{content:"";display:block;width:38%;height:100%;background:#d6cec2;animation:bar 1.1s ease-in-out infinite alternate}@keyframes bar{to{transform:translateX(160%)}}
.ready .load{opacity:0;pointer-events:none}.hint{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);z-index:8;padding:9px 12px;border:1px solid rgba(255,255,255,.08);border-radius:999px;background:rgba(10,10,10,.76);backdrop-filter:blur(10px);font-size:10px;color:#ddd6cd;white-space:nowrap;opacity:0;transition:.25s}
model-viewer[ar-status="session-started"]~.hint{opacity:1}
footer{height:46px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;color:#77736d;font-size:9px;letter-spacing:.04em}
@media(min-width:900px){model-viewer{height:calc(100svh - 114px)}.copy{left:34px;top:30px}h1{font-size:64px}.arbtn{width:390px;left:50%;right:auto;transform:translateX(-50%)}}
</style>
</head>
<body>
<div class="app" id="app">
<header>
  <div class="brand"><div class="logo">ЯСН</div><div><b>Гастробар на Ясной</b><small>цифровое меню</small></div></div>
  <div class="badge">AR DEMO 01</div>
</header>
<main>
  <div class="copy">
    <div class="eyebrow">Блюдо перед заказом</div>
    <h1>Поставь его на стол.</h1>
    <div class="sub">Покрути живую 3D модель. Затем включи камеру и примерь подачу прямо к своему столу.</div>
    <div class="live">3D модель создаётся из фото</div>
  </div>

  <model-viewer id="dish"
    alt="3D модель блюда Гастробара на Ясной"
    camera-controls
    touch-action="pan-y"
    auto-rotate
    auto-rotate-delay="500"
    rotation-per-second="14deg"
    autoplay
    environment-image="neutral"
    exposure="1.06"
    shadow-intensity="1.3"
    shadow-softness=".9"
    interaction-prompt="auto"
    ar
    ar-placement="floor"
    ar-scale="auto"
    ar-modes="webxr scene-viewer quick-look"
    xr-environment>
      <button class="arbtn" slot="ar-button">Поставить на стол<small>камера найдёт поверхность и разместит блюдо</small></button>
  </model-viewer>
  <div class="hint">Медленно поводите телефоном над столом</div>
  <div class="load"><b>Собираем цифровое блюдо...</b><i></i></div>
</main>
<footer><span>YASNAYA × KAVA</span><span>DEMO · 1 блюдо</span></footer>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFExporter } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/exporters/GLTFExporter.js';

const app=document.getElementById('app');
const viewer=document.getElementById('dish');

const root=new THREE.Group();
root.name='YasnayaDish';

const ceramic=new THREE.MeshStandardMaterial({color:0xb8b0a5,roughness:.82,metalness:0});
const ceramic2=new THREE.MeshStandardMaterial({color:0x8e877e,roughness:.78,metalness:0});
const paper=new THREE.MeshStandardMaterial({color:0x9a6e43,roughness:.95,metalness:0,side:THREE.DoubleSide});
const fried=new THREE.MeshStandardMaterial({color:0xd78328,roughness:.72,metalness:0});
const fried2=new THREE.MeshStandardMaterial({color:0xb85d18,roughness:.78,metalness:0});
const sauceMat=new THREE.MeshStandardMaterial({color:0xf0c72d,roughness:.38,metalness:0});
const steamMat=new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:.18,roughness:1,metalness:0,side:THREE.DoubleSide});

const plate=new THREE.Mesh(new THREE.CylinderGeometry(.155,.16,.012,72),ceramic);
plate.position.y=.006; root.add(plate);
const plateInner=new THREE.Mesh(new THREE.CylinderGeometry(.137,.145,.006,72),ceramic2);
plateInner.position.y=.014; root.add(plateInner);

const sheet=new THREE.Mesh(new THREE.BoxGeometry(.265,.004,.17),paper);
sheet.position.set(-.006,.019,.004); sheet.rotation.y=-.08; root.add(sheet);

const bowl=new THREE.Mesh(new THREE.CylinderGeometry(.047,.041,.043,64),ceramic);
bowl.position.set(.072,.043,-.035); root.add(bowl);
const sauce=new THREE.Mesh(new THREE.CylinderGeometry(.038,.038,.004,64),sauceMat);
sauce.position.set(.072,.066,-.035); root.add(sauce);

function nugget(x,z,sx,sz,rot,shade=false){
  const g=new THREE.SphereGeometry(1,28,18);
  const m=new THREE.Mesh(g,shade?fried2:fried);
  m.scale.set(sx,.013,sz);
  m.position.set(x,.042,z);
  m.rotation.y=rot;
  m.rotation.z=(Math.random()-.5)*.08;
  root.add(m);
  return m;
}
nugget(-.070,-.028,.047,.020,.20);
nugget(-.030,-.050,.043,.019,-.28,true);
nugget(.012,-.025,.049,.022,.52);
nugget(-.064,.014,.045,.019,-.48,true);
nugget(-.020,.006,.046,.020,.04);
nugget(.025,.022,.044,.020,-.40,true);
nugget(-.035,.050,.045,.019,.34);
nugget(.025,.056,.041,.018,-.16);
nugget(.062,.027,.038,.017,.48);

const crumbs=[];
for(let i=0;i<18;i++){
  const c=new THREE.Mesh(new THREE.SphereGeometry(.0025+Math.random()*.0015,8,6),fried2);
  c.position.set(-.10+Math.random()*.17,.026,-.075+Math.random()*.13);
  root.add(c); crumbs.push(c);
}

const steam=[];
for(let i=0;i<3;i++){
  const s=new THREE.Mesh(new THREE.CylinderGeometry(.003,.006,.055,12,1,true),steamMat.clone());
  s.name='steam'+i;
  s.position.set(.055+i*.015,.105,-.04+i*.006);
  s.rotation.z=(i-1)*.18;
  root.add(s); steam.push(s);
}

root.rotation.x=0;
root.scale.setScalar(1);

const animations=[];
for(let i=0;i<steam.length;i++){
  const s=steam[i], t=[0,1.6,3.2];
  const p=s.position;
  const pos=new THREE.VectorKeyframeTrack(`${s.name}.position`,t,[
    p.x,p.y,p.z,
    p.x+(i-1)*.006,p.y+.035,p.z+.004,
    p.x,p.y,p.z
  ]);
  const sc=new THREE.VectorKeyframeTrack(`${s.name}.scale`,t,[
    .8,.8,.8, 1.15,1.45,1.15, .8,.8,.8
  ]);
  animations.push(new THREE.AnimationClip('steamLoop'+i,3.2,[pos,sc]));
}

const exporter=new GLTFExporter();
exporter.parse(
  root,
  result=>{
    const blob=new Blob([result],{type:'model/gltf-binary'});
    const url=URL.createObjectURL(blob);
    viewer.src=url;
    viewer.addEventListener('load',()=>app.classList.add('ready'),{once:true});
  },
  err=>{
    console.error(err);
    document.querySelector('.load').innerHTML='<b>Не удалось собрать 3D модель.</b><br>Обнови страницу ещё раз.';
  },
  {binary:true,animations,onlyVisible:true,trs:false}
);

viewer.addEventListener('ar-status',e=>{
  if(e.detail.status==='failed'){
    alert('AR не поддерживается этим устройством или браузером. 3D модель можно продолжить смотреть прямо на странице.');
  }
});
</script>
</body>
</html>
